name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node (typecheck, lint, format, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  python:
    name: Python (lint, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - run: ruff check data-pipeline tests
      - run: ruff format --check data-pipeline tests
      - run: pytest
