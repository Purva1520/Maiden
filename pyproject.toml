[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maiden-data-pipeline"
version = "0.0.0"
description = "Maiden Python data pipeline (Phase 0 foundation)."
readme = "docs/data-policy.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.1",
  "scipy>=1.14",
  "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

# The pipeline lives under data-pipeline/. Its subpackages (ingest, cleaning,
# normalization, ratings, validation, export) are made importable via the
# package-dir mapping below.
[tool.setuptools]
package-dir = { "" = "data-pipeline" }

[tool.setuptools.packages.find]
where = ["data-pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests", "data-pipeline"]
pythonpath = ["data-pipeline"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "node_modules", "data", "notebooks"]

[tool.ruff.lint]
# A lightweight, sensible baseline: pyflakes, pycodestyle, isort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# First-party packages live under data-pipeline/ (on the path at runtime/tests).
known-first-party = [
  "core",
  "ingest",
  "parsers",
  "cleaning",
  "validation",
  "export",
  "normalization",
  "ratings",
]

[tool.ruff.format]
quote-style = "double"
